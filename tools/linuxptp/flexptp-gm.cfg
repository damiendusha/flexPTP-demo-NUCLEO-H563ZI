#
# linuxptp grandmaster configuration for the flexPTP NUCLEO-H563ZI demo.
#
# Derived from linuxptp's shipped gPTP.cfg (802.1AS), with the overrides this
# target needs folded in so the command line stays short.
#
# OPTIONAL. docs/host_ptp_setup.md documents the stock-file route as the one to
# prefer, since this copy will not pick up upstream changes to gPTP.cfg.
#
# Install to /etc/linuxptp/ -- NOT /usr/share/doc/. The AppArmor profile at
# /etc/apparmor.d/usr.sbin.ptp4l confines ptp4l's config reads to
# "@{etc_ro}/linuxptp/** r", so any other location fails with "Permission
# denied" even when run as root.
#
#   sudo install -D -m644 tools/linuxptp/flexptp-gm.cfg /etc/linuxptp/flexptp-gm.cfg
#   sudo ptp4l -f /etc/linuxptp/flexptp-gm.cfg -i <iface> -S -m
#
# Drop -S if your NIC has a PTP hardware clock (check: ethtool -T <iface>).
#
[global]
#
# --- must match the target's gPTP profile ---
# NOTE: the board boots the "default" preset (UDP/IPv4 + E2E), which a stock
# ptp4l matches with no config file at all -- this file is ONLY for the gPTP
# route, and the target must be put into it with "ptp profile preset gPTP".
# gPTP also cannot cross ordinary bridges; see docs/ptp_profiles.md.
#
# These four are the ones that fail silently if wrong: the host looks healthy
# and the target simply never sees a frame.
transportSpecific       0x1
ptp_dst_mac             01:80:C2:00:00:0E
network_transport       L2
delay_mechanism         P2P

# --- act as grandmaster ---
# The board defaults to priority1 = 128. linuxptp's stock gPTP.cfg ships 248,
# which LOSES the BMCA election to the board. 100 wins it.
serverOnly              1
gmCapable               1
priority1               100
priority2               248

# --- timing, matching the target's preset ---
logSyncInterval         -3
logAnnounceInterval     0
syncReceiptTimeout      3

# --- 802.1AS extras, as per the stock gPTP.cfg ---
neighborPropDelayThresh 800
min_neighbor_prop_delay -20000000
assume_two_step         1
path_trace_enabled      1
follow_up_info          1
