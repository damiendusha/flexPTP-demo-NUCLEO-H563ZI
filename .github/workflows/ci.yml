name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# No `submodules: recursive` anywhere below. The vendored trees are git repositories declared in
# //bazel/repositories.bzl and fetched by Bazel, and the patches that used to be
# working-tree edits are attached to the fetch. That also retires the old `--check-patches` job:
# there is no longer a working tree that can be pristine, patched, or -- the state build.sh had
# to detect and refuse -- neither.

jobs:
  build:
    name: ${{ matrix.project }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [dbg, opt]
        project:
          - flexptp_demo_stm32h563/flexptp_threadx_netx_demo
          - flexptp_demo_stm32h563/flexptp_freertos_lwip_demo
        include:
          - project: flexptp_demo_stm32h563/flexptp_threadx_netx_demo
            target: flexptp-demo
          - project: flexptp_demo_stm32h563/flexptp_freertos_lwip_demo
            target: flexptp-demo-freertos

    steps:
      - uses: actions/checkout@v4

      # Keyed on the lockfile, which pins the module graph, and on MODULE.bazel, which pins the
      # compiler by sha256 and the vendored trees by commit.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      # No `set -o pipefail` guard is needed any more: there is no pipeline for tee to swallow
      # the exit status of (finding N16), because there is no log to grep. First-party warnings
      # are -Werror inside the build itself (D13), so a warning fails the compile rather than
      # being detected afterwards.
      - name: Build
        run: bazel build --config=${{ matrix.config }} //projects/${{ matrix.project }}:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.config }}
          path: |
            bazel-bin/projects/${{ matrix.project }}/${{ matrix.target }}.elf
            bazel-bin/projects/${{ matrix.project }}/${{ matrix.target }}.elf.map
            bazel-bin/projects/${{ matrix.project }}/${{ matrix.target }}.hex

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      # OpenOCD's configure needs these. The default openocd=source mode builds ST's fork, and
      # a runner has no OpenOCD to fall back on -- `=local` FAILS here rather than skipping,
      # which a clean-clone test caught after this job was first written that way.
      - name: Install OpenOCD build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config autoconf automake libtool

      # One invocation covers the host unit tests, the C++ rules asserted against the linked
      # image, the OpenOCD capability check and the resolver tests -- host and target are two
      # platforms in one graph, so there is no separate test root to configure.
      #
      # This builds ST's OpenOCD the first time, which is minutes; the Bazel cache above keys on
      # MODULE.bazel, so it only rebuilds when the pin moves. Worth it: it means CI proves a
      # clean clone can flash, which is the property phase 7 relied on to delete build.sh.
      - name: Test
        run: bazel test //...

  # The C/C++ tests again, under AddressSanitizer, LeakSanitizer and UBSan (--config=asan in
  # .bazelrc), each fatal on its first report. Its own job, so a sanitizer finding and a functional
  # failure read as different things. See docs/static_analysis_plan.md, phase 1.
  sanitizers:
    name: Sanitizers (ASan, LSan, UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Its own key: actions/cache saves a key once, so sharing the Tests job's would leave the
      # sanitizer builds, which are different actions, never cached.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-asan-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel') }}
          restore-keys: bazel-asan-${{ runner.os }}-

      # The C/C++ tests only. //... would also rebuild an ASan OpenOCD for the capability test,
      # which gains nothing and costs minutes. The query is its own line so that a failure there
      # fails the step instead of leaving bazel test with nothing to run.
      - name: Test under the sanitizers
        run: |
          targets=$(bazel query 'kind(cc_test, //...)')
          bazel test --config=asan --test_output=errors $targets

  static-analysis:
    name: Static analysis (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Three trees: the two firmwares' own directories and the code they share. Since phase 9
      # moved the driver, the PHY driver, the NSD units, the CLI, the console and the runtime into
      # lib/, a matrix over the projects alone analysed none of it.
      matrix:
        project:
          - flexptp_demo_stm32h563/flexptp_threadx_netx_demo
          - flexptp_demo_stm32h563/flexptp_freertos_lwip_demo
          - flexptp_demo_stm32h563/lib
        include:
          # lwip_port/sys_arch.c #errors unless the kernel's configuration is visible, and it only
          # arrives through FreeRTOS.h -- which is in @freertos, fetched by Bazel, not on disk
          # here. So the project's real FreeRTOSConfig.h is forced in, plus the one FreeRTOS.h
          # default sys_arch.c tests and the config does not set. Without them the file is not
          # analysed at all: cppcheck abandons a configuration at its first #error.
          - project: flexptp_demo_stm32h563/flexptp_freertos_lwip_demo
            extra: >-
              --include=projects/flexptp_demo_stm32h563/flexptp_freertos_lwip_demo/FreeRTOSConfig.h
              -DconfigSUPPORT_DYNAMIC_ALLOCATION=1
          # What only ever runs on the build machine stays out: the Cortex-M33 shims, the Ethernet
          # DMA model, the driver's host wrapper and the GoogleTest files. --platform=unix32 models
          # the target, so it reads their 64-bit uintptr_t as 32 bits and reports each
          # `addr >> 32` -- the checks that prove the MAP_32BIT arena works -- as undefined. They
          # are compiled with -fanalyzer instead, which sees the host as it is.
          - project: flexptp_demo_stm32h563/lib
            extra: >-
              -i projects/flexptp_demo_stm32h563/lib/host
              -i projects/flexptp_demo_stm32h563/lib/eth/eth_model.cpp
              -i projects/flexptp_demo_stm32h563/lib/eth/mac_drv_uut.c
              -i 'projects/flexptp_demo_stm32h563/lib/**/*_test.cpp'
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # lib/io's headers are included as "standard_output/serial_io.h", a directory that exists
      # only in Bazel's execroot: //projects/flexptp_demo_stm32h563/lib:io_headers sets
      # include_prefix = "standard_output". Without it the include is silently skipped
      # (missingInclude is suppressed, because the HAL and the kernels are not on disk here
      # either), ANSI_COLOR_* go undefined, and every coloured MSG() is an unknownMacro error. That
      # is how this job went red when phase 9 moved the console out of the projects.
      - name: Recreate Bazel's include prefix
        run: |
          mkdir -p "$RUNNER_TEMP/include"
          ln -s "$GITHUB_WORKSPACE/projects/flexptp_demo_stm32h563/lib/io" "$RUNNER_TEMP/include/standard_output"

      # Scoped to first-party sources. Everything else in the tree is vendored at a pinned commit,
      # and a finding in NetX Duo or the HAL is not this project's to fix -- the same reasoning as
      # scoping -Werror to first-party targets. ARM's CMSIS headers are on the include path so the
      # register layouts are real types, and suppressed by path for the same reason: cmsis_gcc.h's
      # startup code compares linker symbols, which cppcheck reports and ARM is not going to change.
      # __GNUC__ is the pinned arm-none-eabi-gcc's major: cmsis_compiler.h #errors without a
      # compiler, and cmsis_gcc.h tests the version.
      - name: Analyse the first-party sources
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c11 \
            --platform=unix32 \
            -DSTM32H563xx -DUSE_HAL_DRIVER -DCMSIS_OS2 -DPPS_SIMPLE -D__GNUC__=15 \
            -I projects/${{ matrix.project }} \
            -I projects/flexptp_demo_stm32h563/lib \
            -I "$RUNNER_TEMP/include" \
            -I third_party/CMSIS/Include \
            -I third_party/CMSIS/Device/ST/STM32H5xx/Include \
            -I third_party/CMSIS/CMSIS_RTOS_V2 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            '--suppress=*:third_party/*' \
            ${{ matrix.extra }} \
            projects/${{ matrix.project }}/

  docs:
    name: Docs cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/check_docs_links.py
