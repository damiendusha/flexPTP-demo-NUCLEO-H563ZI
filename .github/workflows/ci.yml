name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# No `submodules: recursive` anywhere below. The vendored trees are git repositories declared in
# //bazel/repositories.bzl and fetched by Bazel, and the four patches that used to be
# working-tree edits are attached to the fetch. That also retires the old `--check-patches` job:
# there is no longer a working tree that can be pristine, patched, or -- the state build.sh had
# to detect and refuse -- neither.

jobs:
  build:
    name: Firmware (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [dbg, opt]

    steps:
      - uses: actions/checkout@v4

      # Keyed on the lockfile, which pins the module graph, and on MODULE.bazel, which pins the
      # compiler by sha256 and the vendored trees by commit.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      # No `set -o pipefail` guard is needed any more: there is no pipeline for tee to swallow
      # the exit status of (finding N16), because there is no log to grep. First-party warnings
      # are -Werror inside the build itself (D13), so a warning fails the compile rather than
      # being detected afterwards.
      - name: Build
        run: bazel build --config=${{ matrix.config }} //projects/flexptp_threadx_netx_demo:flexptp-demo

      - uses: actions/upload-artifact@v4
        with:
          name: flexptp-demo-${{ matrix.config }}
          path: |
            bazel-bin/projects/flexptp_threadx_netx_demo/flexptp-demo.elf
            bazel-bin/projects/flexptp_threadx_netx_demo/flexptp-demo.elf.map
            bazel-bin/projects/flexptp_threadx_netx_demo/flexptp-demo.hex

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      # One invocation covers the host unit tests, the C++ rules asserted against the linked
      # image, and the resolver tests -- host and target are two platforms in one graph, so
      # there is no separate test root to configure.
      #
      # --//tools/flash:openocd=local keeps CI off the OpenOCD source build, which takes minutes
      # and needs libusb headers, and nothing here flashes a board.
      - name: Test
        run: bazel test //... --//tools/flash:openocd=local

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Scoped to the project's own sources. Everything else in the tree is vendored at a pinned
      # commit, and a finding in NetX Duo or the HAL is not this project's to fix -- the same
      # reasoning as scoping -Werror to first-party targets.
      - name: Analyse the first-party sources
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c11 \
            --platform=unix32 \
            -DSTM32H563xx -DUSE_HAL_DRIVER -DETH_NETXDUO -DCMSIS_OS2 -DPPS_SIMPLE \
            -I projects/flexptp_threadx_netx_demo -I third_party \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            projects/flexptp_threadx_netx_demo/

  docs:
    name: Docs cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/check_docs_links.py
